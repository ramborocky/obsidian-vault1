plugins {
    id 'com.android.application'
}

android {
    namespace 'tz.mnada.exchange'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "tz.mnada.exchange"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-demo"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the demo installs directly from the file.
            // Replace with a real release keystore before any distribution.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
