<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A road forking: one branch runs to a town representing the practice, the other climbs into hills representing the book. Both start from the same point."><style>.svg-t{font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 13px; fill: #142028; letter-spacing: 0.04em;}.svg-s{font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 10.5px; fill: #75838B; letter-spacing: 0.14em; text-transform: uppercase;}.svg-n{font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 22px;}</style><rect x="0" y="0" width="1200" height="400" fill="#EDE7D6"/>
        <rect x="0" y="0" width="1200" height="400" fill="#EDE7D6"></rect>
        <rect x="0" y="0" width="1200" height="180" fill="url(#dotsF)" opacity="0.12"></rect>

        <polygon points="560,400 640,400 700,150 660,150" fill="#142028" opacity="0.15"></polygon>
        <polygon points="560,400 640,400 520,150 480,150" fill="#142028" opacity="0.15"></polygon>
        <polygon points="560,400 640,400 690,160 668,160" fill="#1E6E8C" opacity="0.55"></polygon>
        <polygon points="560,400 640,400 530,160 508,160" fill="#E0451F" opacity="0.6"></polygon>

