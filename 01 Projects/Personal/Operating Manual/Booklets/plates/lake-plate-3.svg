<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Bar chart: the monthly saving needed for a million dollars in three years is $27,778, against $2,400 at the top of the freelance range and $1,228 for the household and debt service."><style>.svg-t{font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 13px; fill: #142028; letter-spacing: 0.04em;}.svg-s{font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 10.5px; fill: #75838B; letter-spacing: 0.14em; text-transform: uppercase;}.svg-n{font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 22px;}</style><rect x="0" y="0" width="1200" height="380" fill="#EDE7D6"/>
        <rect x="0" y="0" width="1200" height="380" fill="#EDE7D6"></rect>
        <text x="60" y="52" class="svg-s">Monthly, to reach $1,000,000 in 36 months</text>

        <rect x="60" y="80" width="1080" height="52" fill="#E0451F" opacity="0.9"></rect>
        <text x="76" y="114" class="svg-n" fill="#EDE7D6">$27,778</text>
        <text x="1124" y="114" class="svg-t" text-anchor="end" fill="#EDE7D6">every month, for three years</text>

        <text x="60" y="188" class="svg-s">Top of the freelance range</text>
        <rect x="60" y="204" width="93" height="46" fill="#1E6E8C" opacity="0.85"></rect>
        <text x="170" y="234" class="svg-t">$2,400 — twenty hours a week at a specialist rate</text>

        <text x="60" y="290" class="svg-s">Household plus both lenders</text>
        <rect x="60" y="306" width="48" height="46" fill="#124454"></rect>
        <text x="126" y="336" class="svg-t">$1,228 — the number that actually has to be beaten</text>
      </svg>