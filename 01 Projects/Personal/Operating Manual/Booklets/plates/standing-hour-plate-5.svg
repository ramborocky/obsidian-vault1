<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="Two pipelines with four stages. Widening a non-constraint leaves throughput at 20; widening the constraint raises it to 44."><style>.svg-label{font-family: "JetBrains Mono", monospace; font-size: 11px; fill: #737C88; letter-spacing: 0.06em;}.svg-name{font-family: "Newsreader", Georgia, serif; font-size: 14px; fill: #E4E7EA;}.svg-num{font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 700; fill: #E4E7EA;}</style><rect x="0" y="0" width="640" height="270" fill="#171C24"/>
        <defs>
          <marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
          </marker>
        </defs>
        <text x="20" y="22" class="svg-label">A — WIDEN A NON-CONSTRAINT</text>
        <rect x="20"  y="40" width="86" height="60" fill="#1E242E" stroke="#3E4A59"></rect>
        <rect x="126" y="40" width="86" height="60" fill="#1E242E" stroke="#3E4A59"></rect>
        <rect x="232" y="60" width="86" height="20" fill="#C4644C" stroke="#3E4A59"></rect>
        <rect x="338" y="40" width="86" height="60" fill="#C89B4A" stroke="#3E4A59"></rect>
        <text x="63"  y="118" text-anchor="middle" class="svg-label">craft</text>
        <text x="169" y="118" text-anchor="middle" class="svg-label">notes</text>
        <text x="275" y="118" text-anchor="middle" class="svg-label" fill="#C4644C">cash</text>
        <text x="381" y="118" text-anchor="middle" class="svg-label" fill="#C89B4A">tooling +</text>
        <line x1="434" y1="70" x2="500" y2="70" stroke="currentColor" stroke-width="2" marker-end="url(#ah5)" color="#737C88"></line>
        <rect x="508" y="60" width="26" height="20" fill="#C4644C"></rect>
        <text x="544" y="76" class="svg-num" fill="#C4644C">20</text>
        <text x="544" y="92" class="svg-label">unchanged</text>
        <text x="20" y="176" class="svg-label">B — WIDEN THE CONSTRAINT</text>
        <rect x="20"  y="194" width="86" height="60" fill="#1E242E" stroke="#3E4A59"></rect>
        <rect x="126" y="194" width="86" height="60" fill="#1E242E" stroke="#3E4A59"></rect>
        <rect x="232" y="202" width="86" height="44" fill="#C89B4A" stroke="#3E4A59"></rect>
        <rect x="338" y="194" width="86" height="60" fill="#1E242E" stroke="#3E4A59"></rect>
        <text x="275" y="272" text-anchor="middle" class="svg-label" fill="#C89B4A">cash +</text>
        <line x1="434" y1="224" x2="500" y2="224" stroke="currentColor" stroke-width="2" marker-end="url(#ah5)" color="#737C88"></line>
        <rect x="508" y="202" width="26" height="44" fill="#57A08F"></rect>
        <text x="544" y="230" class="svg-num" fill="#57A08F">44</text>
      </svg>