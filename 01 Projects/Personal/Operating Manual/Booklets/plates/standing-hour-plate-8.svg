<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="A four-phase ladder over thirty-six months, each phase rising and carrying a proof gate: three paid invoices, a package sold three times unmodified, a first inbound enquiry, and a month where a third of income arrives hands-off."><style>.svg-label{font-family: "JetBrains Mono", monospace; font-size: 11px; fill: #737C88; letter-spacing: 0.06em;}.svg-name{font-family: "Newsreader", Georgia, serif; font-size: 14px; fill: #E4E7EA;}.svg-num{font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 700; fill: #E4E7EA;}</style><rect x="0" y="0" width="640" height="260" fill="#171C24"/>
        <line x1="20" y1="228" x2="612" y2="228" stroke="#3E4A59" stroke-width="1"></line>
        <rect x="20"  y="188" width="132" height="40" fill="#C89B4A"></rect>
        <rect x="160" y="156" width="132" height="72" fill="#1E242E" stroke="#3E4A59"></rect>
        <rect x="300" y="112" width="152" height="116" fill="#1E242E" stroke="#3E4A59"></rect>
        <rect x="460" y="60"  width="152" height="168" fill="#1E242E" stroke="#3E4A59"></rect>
        <text x="86"  y="212" text-anchor="middle" class="svg-num" fill="#10141A">1</text>
        <text x="226" y="196" text-anchor="middle" class="svg-num">2</text>
        <text x="376" y="174" text-anchor="middle" class="svg-num">3</text>
        <text x="536" y="150" text-anchor="middle" class="svg-num">4</text>
        <text x="86"  y="246" text-anchor="middle" class="svg-label">MONTH 1–3</text>
        <text x="226" y="246" text-anchor="middle" class="svg-label">MONTH 4–12</text>
        <text x="376" y="246" text-anchor="middle" class="svg-label">YEAR 2</text>
        <text x="536" y="246" text-anchor="middle" class="svg-label">YEAR 3</text>
        <polygon points="152,180 160,172 168,180 160,188" fill="#57A08F"></polygon>
        <polygon points="292,148 300,140 308,148 300,156" fill="#57A08F"></polygon>
        <polygon points="452,104 460,96 468,104 460,112" fill="#57A08F"></polygon>
        <polygon points="604,52 612,44 620,52 612,60" fill="#57A08F"></polygon>
        <text x="20"  y="30" class="svg-label" fill="#57A08F">GATES — a phase ends when its gate clears, not when the months run out</text>
        <text x="160" y="166" class="svg-label">3 paid invoices</text>
        <text x="300" y="134" class="svg-label">package sold 3× unmodified · debt cleared</text>
        <text x="460" y="90" class="svg-label">first enquiry you didn't chase</text>
        <text x="612" y="38" text-anchor="end" class="svg-label">a third of income, hands off</text>
      </svg>