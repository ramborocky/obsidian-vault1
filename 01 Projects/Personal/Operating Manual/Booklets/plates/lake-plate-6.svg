<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="A four-step ladder over thirty-six months. Each step carries a proof gate: three paid invoices, a package sold three times, a first unchased enquiry, and a month where a third of income arrives hands-off."><style>.svg-t{font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 13px; fill: #142028; letter-spacing: 0.04em;}.svg-s{font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 10.5px; fill: #75838B; letter-spacing: 0.14em; text-transform: uppercase;}.svg-n{font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 22px;}</style><rect x="0" y="0" width="1200" height="420" fill="#EDE7D6"/>
        <rect x="0" y="0" width="1200" height="420" fill="#EDE7D6"></rect>
        <line x1="60" y1="358" x2="1140" y2="358" stroke="#142028" stroke-width="3"></line>

        <rect x="60" y="286" width="250" height="72" fill="#E0451F" opacity="0.92"></rect>
        <rect x="322" y="230" width="250" height="128" fill="#1E6E8C" opacity="0.42"></rect>
        <rect x="584" y="166" width="266" height="192" fill="#1E6E8C" opacity="0.3"></rect>
        <rect x="862" y="96" width="278" height="262" fill="#1E6E8C" opacity="0.2"></rect>

        <text x="80" y="330" class="svg-n" fill="#EDE7D6">1</text>
        <text x="342" y="274" class="svg-n" fill="#142028">2</text>
        <text x="604" y="210" class="svg-n" fill="#142028">3</text>
        <text x="882" y="140" class="svg-n" fill="#142028">4</text>

        <text x="60" y="384" class="svg-s">Month 1–3</text>
        <text x="322" y="384" class="svg-s">Month 4–12</text>
        <text x="584" y="384" class="svg-s">Year 2</text>
        <text x="862" y="384" class="svg-s">Year 3</text>

        <g fill="#E0451F">
          <polygon points="310,286 322,274 334,286 322,298"></polygon>
          <polygon points="572,230 584,218 596,230 584,242"></polygon>
          <polygon points="850,166 862,154 874,166 862,178"></polygon>
          <polygon points="1128,96 1140,84 1152,96 1140,108"></polygon>
        </g>

        <text x="330" y="252" class="svg-t">3 paid invoices</text>
        <text x="592" y="188" class="svg-t">package sold 3× unmodified · debt cleared</text>
        <text x="870" y="118" class="svg-t">first enquiry you didn't chase</text>
        <text x="1140" y="70" class="svg-t" text-anchor="end">a third of income, hands off</text>

        <text x="60" y="52" class="svg-s">Gates, not calendar dates</text>
      </svg>