plugins {
    id 'com.android.application'
}

// Release signing reads an untracked keystore.properties in android/ (same pattern as MNADA):
//
//   storeFile=C:/keys/soma-release.jks
//   storePassword=...
//   keyAlias=soma
//   keyPassword=...
//
// Without it the build falls back to the debug key. That's fine for a personal app sideloaded
// onto your own phone, but an update signed with a different key won't install over it.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasReleaseKey = keystorePropsFile.exists()
if (hasReleaseKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'tz.rhythm.soma'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "tz.rhythm.soma"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
