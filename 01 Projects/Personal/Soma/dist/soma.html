<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="Soma: an offline study and writing feed. Swipe through today's work, one focused block at a time.">
<title>Soma</title>
<style>:root {
  --bg: #0b0f14; --panel: #131a22; --panel-2: #1a232e; --line: #26313e;
  --text: #eef2f6; --muted: #9aa8b6; --faint: #6b7886;
  --writing: #f0714b; --maf: #5aafcc; --life: #6fbfa9; --method: #c08ab0; --gold: #e3bc6b;
  --danger: #ff6b6b; --ok: #6fbfa9;
  --radius: 16px; --top: 56px; --bottom: 60px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f2ec; --panel: #ffffff; --panel-2: #f0ece4; --line: #ddd6ca;
    --text: #1d232a; --muted: #5d6874; --faint: #8a949e;
    --writing: #c93c18; --maf: #1e6e8c; --life: #3e8574; --method: #7a4a6b; --gold: #a97c2e;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

#app { position: relative; height: 100dvh; max-width: 520px; margin: 0 auto; overflow: hidden; background: var(--bg); }
@media (min-width: 700px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* ---------- top bar ---------- */
.top { position: absolute; inset: 0 0 auto 0; height: var(--top); z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: 0 12px; background: linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 0%, transparent)); }
.modes { display: flex; gap: 2px; flex-shrink: 0; }
.modes button, .chip { border: 0; background: transparent; color: var(--muted); padding: 5px 9px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.modes button[aria-pressed="true"] { color: var(--text); background: var(--panel-2); }
.areas { display: flex; gap: 2px; margin-left: auto; }
.areas button { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 3px 8px; border-radius: 999px; font-size: 12px; }
.areas button[aria-pressed="true"][data-area="maf"] { color: var(--maf); border-color: var(--maf); }
.areas button[aria-pressed="true"][data-area="writing"] { color: var(--writing); border-color: var(--writing); }
.areas button[aria-pressed="true"][data-area="all"] { color: var(--text); border-color: var(--text); }
.xp { border: 0; background: var(--panel-2); color: var(--gold); padding: 5px 9px; border-radius: 999px; font-weight: 700; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
.top { gap: 6px; padding: 0 8px; }
.areas { margin-left: auto; flex-shrink: 1; min-width: 0; }
.areas[hidden] + .xp { margin-left: auto; }
@media (max-width: 400px) { .areas button { padding: 3px 6px; font-size: 11px; } .xp .lv { display: none; } }

/* ---------- views ---------- */
.view { position: absolute; inset: var(--top) 0 var(--bottom) 0; overflow-y: auto; }
.feed { overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
.feed::-webkit-scrollbar { display: none; }
.page { padding: 8px 14px 32px; }

/* ---------- cards ---------- */
.card { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: flex-end;
  padding: 18px 76px 24px 18px; overflow: hidden; --accent: var(--life); }
.card::before { content: ""; position: absolute; inset: 0; z-index: 0;
  background: radial-gradient(120% 70% at 20% 10%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 60%),
              radial-gradient(90% 60% at 100% 100%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%), var(--bg); }
.card.area-maf { --accent: var(--maf); } .card.area-writing { --accent: var(--writing); }
.card.area-method { --accent: var(--method); } .card.area-life { --accent: var(--life); }
.card > * { position: relative; z-index: 1; }
.card .big { position: absolute; top: 18%; left: 18px; font-size: 76px; line-height: 1; opacity: .9; z-index: 1; }
.card-body { max-width: 100%; }
.kind { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); padding: 2px 8px; border-radius: 999px; }
.kind.explore::after { content: " · new to you"; color: var(--muted); }
.card h2 { margin: 10px 0 4px; font-size: 26px; line-height: 1.15; }
.card .by { margin: 0 0 8px; color: var(--muted); }
.card .note { margin: 0 0 10px; font-size: 16px; }
.card .meta { color: var(--muted); font-size: 13px; }
.card .tags { color: var(--accent); font-size: 13px; margin: 6px 0 0; }
.card .source { font-size: 12px; color: var(--muted); margin-top: 8px; }
.card .evidence { display: inline-block; margin-top: 4px; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--panel-2); color: var(--muted); }
.card .tryit { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--panel) 70%, transparent); border-radius: 0 10px 10px 0; }
.why { margin-top: 12px; border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 0; font-size: 13px; }
.whybox { margin-top: 8px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); border-radius: 10px; padding: 8px 10px; }
.whybox table { width: 100%; border-collapse: collapse; }
.whybox td { padding: 1px 4px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent, var(--gold)); }

.rail { position: absolute; right: 10px; bottom: 28px; display: flex; flex-direction: column; gap: 14px; align-items: center; z-index: 2; }
.rail a { text-decoration: none; }
.rail button, .rail a { width: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text); font-size: 11px; }
.rail :is(button, a) .ico { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: color-mix(in srgb, var(--panel-2) 85%, transparent); border: 1px solid var(--line); }
.rail button.primary .ico { background: var(--accent); color: #0b0f14; border: 0; width: 60px; height: 60px; font-size: 26px; }
.swipehint { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--faint); z-index: 1; }

/* ---------- bottom nav ---------- */
.bottom { position: absolute; inset: auto 0 0 0; height: var(--bottom); display: flex; border-top: 1px solid var(--line); background: var(--bg); z-index: 5; }
.bottom button { flex: 1; border: 0; background: transparent; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.bottom button .ico { font-size: 20px; }
.bottom button[aria-current="page"] { color: var(--text); }

/* ---------- panels, forms ---------- */
h3 { margin: 18px 0 8px; font-size: 15px; letter-spacing: .02em; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 10px 0; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.small { font-size: 12px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 8px 12px; border-radius: 10px; font-weight: 600; }
.btn.primary { background: var(--gold); color: #1d1405; border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn.tiny { padding: 3px 8px; font-size: 12px; border-radius: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
textarea { min-height: 72px; resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.dot.maf { background: var(--maf); } .dot.writing { background: var(--writing); } .dot.life { background: var(--life); }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-size: 20px; }
.days { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 8px; }
.days > div { flex: 1; background: var(--gold); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
.days > div span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--faint); }
.badge { display: inline-block; margin: 3px; padding: 4px 9px; border-radius: 999px; background: var(--panel-2); font-size: 12px; }
.level { font-size: 22px; font-weight: 800; }
.level small { font-weight: 500; color: var(--muted); font-size: 14px; }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.overlay h2 { margin: 0 0 4px; font-size: 20px; }
.ring { width: 240px; height: 240px; margin: 22px 0; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; }
.flashcard { width: 100%; max-width: 420px; min-height: 200px; margin: 18px 0; padding: 20px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); text-align: left; }
.flashcard .a { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.sheet-wrap { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--panel); border-radius: 20px 20px 0 0; padding: 16px 16px 24px; border-top: 1px solid var(--line); }
.sheet h2 { margin: 0 0 6px; font-size: 19px; }
.rating { display: flex; gap: 6px; }
.rating button { flex: 1; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 8px 0; }
.rating button[aria-pressed="true"] { background: var(--gold); color: #1d1405; border-color: transparent; }
.reveal { margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--panel-2); border-left: 3px solid var(--gold); text-align: left; }
#toast { position: absolute; left: 50%; bottom: calc(var(--bottom) + 16px); transform: translateX(-50%); z-index: 40; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; font-weight: 600; max-width: 90%; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
.xpburst { color: var(--gold); }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="modes" role="group" aria-label="Feed order">
      <button data-mode="smart" aria-pressed="true">For you</button>
      <button data-mode="timetable" aria-pressed="false">Timetable</button>
    </div>
    <div class="areas" role="group" aria-label="Which side">
      <button data-area="all" aria-pressed="true">All</button>
      <button data-area="maf" aria-pressed="false">MAF</button>
      <button data-area="writing" aria-pressed="false">Write</button>
    </div>
    <button class="xp" id="xp">Lv 1 · 0 XP</button>
  </header>

  <main id="view-feed" class="view feed" tabindex="-1" aria-label="Today's feed"><div class="card"><div class="card-body"><h2>Loading…</h2></div></div></main>
  <main id="view-library" class="view" hidden aria-label="Library"></main>
  <main id="view-stats" class="view" hidden aria-label="Stats"></main>
  <main id="view-settings" class="view" hidden aria-label="Settings"></main>

  <nav class="bottom" aria-label="Sections">
    <button data-view="feed" aria-current="page"><span class="ico" aria-hidden="true">▶</span>Feed</button>
    <button data-view="library"><span class="ico" aria-hidden="true">📚</span>Library</button>
    <button data-view="stats"><span class="ico" aria-hidden="true">🏆</span>Stats</button>
    <button data-view="settings"><span class="ico" aria-hidden="true">⚙</span>Settings</button>
  </nav>

  <div id="focus" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Focus timer"></div>
  <div id="sheetwrap" class="sheet-wrap" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<noscript><p style="padding:20px">Soma needs JavaScript turned on.</p></noscript>
<script>window.SOMA_VERSION="0.2.0";window.SOMA_DAILY_TEMPLATE="---\ntags: [daily]\ndate: {{date:YYYY-MM-DD}}\nwrite_min: 0\nstudy_min: 0\nclass: false\nexam_q: 0\nwalk: false\ntablets: false\nexposure: 0\nlog: false\n---\n\n# {{date:dddd D MMMM YYYY}}\n\n```dataviewjs\nawait dv.view(\"01 Projects/Personal/The Game/game\", {mode: \"today\"})\n```\n\n## 🎯 Today's one thing\nIf only one thing gets done today, it's this:\n- \n\n## ✍️ Writing\n*Tue, Thu 05:50 · Sun 07:00. Fiction on Tue/Thu and the 1st and 3rd Sunday; the money essay on the 2nd and 4th Sunday.*\n- Piece:\n- Words:\n\n## 📘 MAF\n*Pre-read 16:30 · class 17:00 · notes 19:45*\n- Tonight's topic:\n- Notes page:\n- One question I can't answer yet:\n\n## 📝 Evening log, 21:00\n1. What I did:\n2. Exposure (sent, asked, showed):\n3. Tablets ✓ / ✗:\n4. Spend logged in [[Expenses]] ✓ / ✗:\n5. Left work on time ✓ / ✗:\n\n*Then tick `log` at the top, and screens off by 21:30.*\n";</script>
<script>/* Soma — seed content. Everything here is data: the engine never hard-codes a book,
   a slot or a method. Edit freely; the app copies seeds into its own state on first run,
   after which the user's library lives in local storage. */
(function (root) {
  "use strict";

  const books = [
    // MAF core
    { id: "saunders-rm", title: "Research Methods for Business Students", author: "Saunders, Lewis & Thornhill", module: "Research Methods", area: "maf", priority: 3 },
    { id: "brooks-econ", title: "Introductory Econometrics for Finance", author: "Chris Brooks", module: "Quantitative Techniques", area: "maf", priority: 3 },

    // Writing and life (from The Rhythm)
    { id: "saunders-swim", title: "A Swim in a Pond in the Rain", author: "George Saunders", module: "Craft", area: "writing", priority: 3 },
    { id: "housel-psych", title: "The Psychology of Money", author: "Morgan Housel", module: "Money", area: "maf", priority: 1 },
  ];

  // Online materials: they need a connection (or a download made beforehand).
  const materials = [
    { id: "ot-fr", title: "OpenTuition — Financial Reporting (FR)", module: "Financial Reporting", area: "maf", url: "https://opentuition.com" },
    { id: "ot-sbr", title: "OpenTuition — Strategic Business Reporting (SBR)", module: "Corporate Reporting", area: "maf", url: "https://opentuition.com" },
    { id: "ot-fm", title: "OpenTuition — Financial Management (FM)", module: "Financial Management", area: "maf", url: "https://opentuition.com" },
    { id: "ot-aa", title: "OpenTuition — Audit and Assurance (AA)", module: "Auditing and Assurance", area: "maf", url: "https://opentuition.com" },
    { id: "mit-15401", title: "MIT OCW 15.401 Finance Theory I (Andrew Lo)", module: "Investments", area: "maf", url: "https://ocw.mit.edu/courses/15-401-finance-theory-i-fall-2008" },
    { id: "damodaran", title: "Damodaran — corporate finance and valuation lectures", module: "Financial Management", area: "maf", url: "https://pages.stern.nyu.edu/~adamodar/" },

  const writing = [
    { id: "chantal", title: "Chantal — the final pass", note: "Commonwealth window opens 1 Jan 2027. Prose control, the open calls on Home.", minutes: 25 },
    { id: "mihogoni", title: "The next Mihogoni story", note: "New pages. Scenes, not explanations.", minutes: 25 },
    { id: "impromptu", title: "The Impromptu", note: "One page, 15 minutes, never finished, never revised.", minutes: 15 },
  ];

  const essay = { id: "essay", title: "This month's money essay", note: "Scene first, finance after, shorter than the scene. Pick a row from Money and Motive.", minutes: 25 };

  const exposureIdeas = [
    "Post the month's money essay",
    "Email one lecturer one question you couldn't answer",
    "Send a draft page to one reader and ask what they skimmed",
    "Pitch one small firm on bookkeeping or reporting work",
    "Ask an ACPA/FCPA member to be a referee",
    "Share one reading takeaway with your study group",
  ];

  const modules = [
    "Financial Reporting", "Financial Management", "Management Accounting", "Auditing and Assurance",
    "Quantitative Techniques", "Research Methods", "Investments", "Multinational Finance",
    "Corporate Reporting", "Behavioral Investments",

  // Timetable slots, local time. days: 0 = Sunday … 6 = Saturday.

  const W = [1, 2, 3, 4, 5], ALL = [0, 1, 2, 3, 4, 5, 6];
  const slots = [
    { id: "dawn", days: ALL, from: "05:00", to: "05:50", fits: ["routine"], routine: "walk" },
    { id: "dawn-study", days: [1, 3, 5], from: "05:50", to: "06:45", fits: ["read", "flash", "exam"] },

    { id: "sun-write", days: [0], from: "07:00", to: "08:30", fits: ["write", "essay"] },

    { id: "pre-read", days: W, from: "16:20", to: "17:00", fits: ["routine"], routine: "preread" },

  ];

  // Routine cards. `sets` is the daily-note property the card fills when done.
  const routines = [
    { id: "walk", title: "Fajr, then 20 minutes outside", note: "Morning light, phone in pocket. This is the meditation.", minutes: 20, area: "life", sets: { walk: true } },
    { id: "tablets", title: "Morning tablets", note: "Take them now, tick it, done.", minutes: 1, area: "life", sets: { tablets: true }, window: ["05:00", "10:00"] },
    { id: "preread", title: "Pre-read for tonight's class", note: "Skim the slides or chapter headings. Walk in with one question.", minutes: 20, area: "maf", study: true },

    { id: "log", title: "The five-line evening log", note: "What I did · one exposure · tablets · spend logged · left work on time.", minutes: 5, area: "life", sets: { log: true }, form: "log" },

  // Methods from the literature. `evidence` is deliberately honest.
  const methods = [
    { id: "deep-work", name: "Deep work", source: "Cal Newport, Deep Work (2016)", evidence: "Practitioner book", idea: "The valuable work is the hard, undistracted kind, and it has to be scheduled, not hoped for.", try: "Block your next 50 minutes now, and name the one thing in it." },

<script>/* Soma — the feed engine. Pure functions over a plain state object, with no DOM, so the
   same file runs in the app, in the APK's WebView and under `node --test`.

   Pipeline (see README.md for the full write-up):
     1. candidates()  every card that is eligible right now
     2. features()    five normalised features per card: T C W F N, plus a penalty
     3. score()       S = 0.30·T + 0.25·C + 0.20·W + 0.15·F + 0.10·N − penalty
     4. diversify()   greedy re-rank: no near-identical cards in a row, plus an exploration budget
     5. record()/complete()  the learning loop: decayed counts, reading speed, spacing

   This is a configurable weighted heuristic, not a trained model. The features are kept
   separate from the scoring so a learned ranker could replace score() later. */
(function (root) {
  "use strict";

  const DAY = 86400000;
  const SCHEMA_VERSION = 1;
  const RANK_VERSION = "rank-v1";
  const DEFAULT_WEIGHTS = { T: 0.30, C: 0.25, W: 0.20, F: 0.15, N: 0.10 };
  const HALF_LIFE_DAYS = 14;        // learned counts halve every two weeks
  const SNOOZE_HALF_LIFE_DAYS = 1;  // a "not now" fades within a day or two
  const SNOOZE_MS = 2 * 3600000;
  const REPEAT_WINDOW_MS = 45 * 60000;  // a kind of work finished this recently…
  const REPEAT_PENALTY = 0.15;          // …is pushed down by this much
  const MAX_EVENTS = 4000;
  const KINDS_WITH_TIMER = ["read", "watch", "flash", "exam", "write", "essay", "task", "routine"];

  // ---------- small helpers ----------
  const pad = (n) => String(n).padStart(2, "0");
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  function dayKey(t) { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function hm(s) { const [h, m] = s.split(":").map(Number); return h * 60 + m; }
  function minuteOfDay(t) { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); }
  function inWindow(mins, from, to) { const a = hm(from), b = hm(to); return a <= b ? mins >= a && mins < b : mins >= a || mins < b; }
  function mondayKey(t) { const d = new Date(t); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dayKey(d); }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  // ---------- state ----------
  function defaultSettings() {
    return {
      weights: { ...DEFAULT_WEIGHTS }, rankVersion: RANK_VERSION,
      mode: "smart",            // smart | timetable
      area: "all",              // all | maf | writing
      blockMin: 25, quietFrom: "21:30", quietTo: "05:00",
      dailyLimitMin: 240,       // focus minutes before the feed tells you to stop
      breakEvery: 2,            // blocks before a break card
      writingDays: [0, 2, 4],   // Sun, Tue, Thu
      weeklyTargets: { write: 150, study: 300 },
      remindersOn: false,
    };
  }

  function initialState(content, now) {
    return {
      schema: SCHEMA_VERSION, created: +now, settings: defaultSettings(),
      books: content.books.map((b) => ({ ...b, totalPages: null, page: 0, active: true, speed: null, updatedAt: 0 })),
      materials: content.materials.map((m) => ({ ...m, active: true, minutesDone: 0, updatedAt: 0 })),
      tasks: [], cards: [], notes: [], events: [], stats: {}, days: {},
      snoozed: {}, hidden: {}, badges: {}, synced: {}, quietOverrideUntil: 0,
      session: { blocks: 0 },
      // ---- sync ----
      // Each device owns its own `days` and nobody else ever edits them; other devices' days
      // arrive as read-only copies in `peers`. That's what makes merging safe: per-device
      // counters are summed, never overwritten. See merge().
      deviceId: "dev-" + uid(), deviceName: "Device", daysAt: 0, peers: {},
      learningResetAt: 0, hiddenClearedAt: 0,
      sync: { addr: "", pin: "", auto: true, lastAt: 0, lastError: null, hubObsidian: false },
    };
  }

  /** Fills in anything a state saved by an older build is missing, so upgrades never wipe data. */
  function migrate(state, content, now) {
    const fresh = initialState(content, now);
    const s = { ...fresh, ...state };
    s.settings = { ...fresh.settings, ...(state.settings || {}) };
    s.settings.weights = { ...DEFAULT_WEIGHTS, ...((state.settings || {}).weights || {}) };
    s.sync = { ...fresh.sync, ...(state.sync || {}) };
    s.peers = state.peers || {};
    // Events written before sync existed get a stable id from their own contents.
    s.events = (state.events || []).map((e) => (e.id ? e : { ...e, id: "legacy-" + e.t + "-" + e.type + "-" + (e.item || "") }));
    s.schema = SCHEMA_VERSION;
    return s;
  }

  const NUM_DAY = ["write_min", "study_min", "exam_q", "exposure", "focus_min", "pages", "deep_blocks", "focus_breaks"];
  const BOOL_DAY = ["class", "walk", "tablets", "log", "active"];
  function blankDay() {
    return { write_min: 0, study_min: 0, class: false, exam_q: 0, walk: false, tablets: false,
      exposure: 0, log: false, focus_min: 0, pages: 0, deep_blocks: 0, focus_breaks: 0, done: {}, active: false };
  }
  /** This device's own record for a day, created if missing. Only this device writes to it. */
  function dayRec(state, dk) {
    if (!state.days[dk]) state.days[dk] = blankDay();
    return state.days[dk];
  }
  /** Two devices' records for the same day, combined: minutes add up, ticks are OR-ed. */
  function addDay(a, b) {
    const out = { ...a, done: { ...(a.done || {}) } };
    for (const f of NUM_DAY) out[f] = (a[f] || 0) + (b[f] || 0);
    for (const f of BOOL_DAY) out[f] = !!(a[f] || b[f]);
    Object.assign(out.done, b.done || {});
    return out;
  }
  /** Every day across this device and every synced device. Read from this; write with dayRec(). */
  function allDays(state) {
    const out = {};
    const add = (days) => { for (const [k, d] of Object.entries(days || {})) out[k] = addDay(out[k] || blankDay(), d); };
    add(state.days);
    for (const p of Object.values(state.peers || {})) add(p && p.days);
    return out;
  }
  const peekDay = (state, dk) => allDays(state)[dk] || blankDay();

  // ---------- decayed statistics ----------
  function decayFactor(fromMs, toMs, halfLife) {
    if (!fromMs) return 1;
    return Math.pow(0.5, Math.max(0, (toMs - fromMs) / DAY) / halfLife);
  }
  function readStat(state, key, now, halfLife = HALF_LIFE_DAYS) {
    const s = state.stats[key];
    if (!s) return { pos: 0, neg: 0, shown: 0, last: 0, touched: 0 };
    const f = decayFactor(s.at, +now, halfLife);
    return { pos: s.pos * f, neg: s.neg * f, shown: s.shown * f, last: s.last || 0, touched: s.touched || 0 };
  }
  function bump(state, key, field, amount, now, halfLife = HALF_LIFE_DAYS) {
    const cur = readStat(state, key, now, halfLife);
    cur[field] += amount;
    state.stats[key] = { pos: cur.pos, neg: cur.neg, shown: cur.shown, at: +now, last: cur.last, touched: cur.touched };
    return state.stats[key];
  }

  // ---------- timetable ----------
  function slotAt(content, now) {
    const d = new Date(now), mins = minuteOfDay(d), dow = d.getDay();
    return content.slots.find((s) => s.days.includes(dow) && inWindow(mins, s.from, s.to)) || null;
  }
  function isQuiet(state, now) {
    if (+now < (state.quietOverrideUntil || 0)) return false;
    return inWindow(minuteOfDay(now), state.settings.quietFrom, state.settings.quietTo);
  }

  // ---------- 1. candidate generation ----------
  function chunkPages(book, blockMin) {
    return Math.max(3, Math.round((book.speed || 0.5) * blockMin));
  }

  function leastPractisedModule(state, content, now) {
    let best = content.modules[0], oldest = Infinity;
    for (const m of content.modules) {
      const t = readStat(state, "exam:" + m, now).touched || 0;
      if (t < oldest) { oldest = t; best = m; }
    }
    return best;
  }

  function weekTotals(state, now) {
    const mk = mondayKey(now), out = { write: 0, study: 0, exposure: 0, days: 0 };
    for (const [k, d] of Object.entries(allDays(state))) {
      if (k >= mk && k <= dayKey(now)) { out.write += d.write_min; out.study += d.study_min; out.exposure += d.exposure; }
    }
    out.days = ((new Date(now).getDay() + 6) % 7) + 1;
    return out;
  }

  function isEssayDay(now) {
    const d = new Date(now);
    if (d.getDay() !== 0) return false;
    const nth = Math.ceil(d.getDate() / 7);
    return nth === 2 || nth === 4;
  }

  function candidates(state, content, now) {
    const s = state.settings, dk = dayKey(now), day = peekDay(state, dk), out = [];
    const snoozed = (id) => (state.snoozed[id] || 0) > +now;
    const mins = minuteOfDay(now);
    const slot = slotAt(content, now);

    for (const b of state.books) {
      const id = "read:" + b.id;
      if (!b.active || b.deleted || snoozed(id) || (b.totalPages && b.page >= b.totalPages)) continue;
      if (!b.totalPages) {
        out.push({ id, key: id, kind: "read", setup: true, area: b.area, topic: b.module, title: b.title, by: b.author,
          note: "First time: enter the page count and the page you're on.", minutes: 2, importance: 0.45 + 0.1 * (b.priority || 1), ref: b.id });
        continue;
      }
      const from = b.page + 1, to = Math.min(b.totalPages, b.page + chunkPages(b, s.blockMin));
      out.push({ id, key: id, kind: "read", area: b.area, topic: b.module, title: b.title, by: b.author,
        note: `Pages ${from}–${to} · about ${s.blockMin} min`, minutes: s.blockMin,
        importance: 0.55 + 0.1 * (b.priority || 1), ref: b.id, pages: { from, to } });
    }

    for (const m of state.materials) {
      const id = "watch:" + m.id;
      if (!m.active || m.deleted || snoozed(id) || state.hidden[id]) continue;
      out.push({ id, key: id, kind: "watch", area: m.area, topic: m.module, title: m.title, url: m.url,
        note: "Needs internet, or a download made beforehand.", minutes: s.blockMin, importance: 0.5, ref: m.id });
    }

    const decks = {};
    for (const c of state.cards) if (c.due <= dk) (decks[c.deck] = decks[c.deck] || []).push(c);
    for (const [deck, list] of Object.entries(decks)) {
      const id = "flash:" + deck;
      if (snoozed(id)) continue;
      const overdue = Math.max(...list.map((c) => (new Date(dk) - new Date(c.due)) / DAY));
      out.push({ id, key: id, kind: "flash", area: "maf", topic: deck, title: `Review ${list.length} due card${list.length > 1 ? "s" : ""}`,
        note: `${deck} · spaced repetition`, minutes: Math.min(20, Math.max(5, list.length)), importance: 0.7 + Math.min(0.2, list.length / 50),
        ref: deck, overdue });
    }

    if (day.exam_q < 3 && !snoozed("exam")) {
      const mod = leastPractisedModule(state, content, now);
      out.push({ id: "exam", key: "exam:" + mod, kind: "exam", area: "maf", topic: mod, title: "One exam question, against the clock",
        note: `${mod} · 15 minutes · NBAA or ACCA past paper`, minutes: 15, importance: 0.85, ref: mod });
    }

    for (const w of content.writing) {
      const id = "write:" + w.id;
      if (snoozed(id)) continue;
      out.push({ id, key: id, kind: "write", area: "writing", topic: w.id, title: w.title, note: w.note, minutes: w.minutes, importance: 0.8, ref: w.id });
    }
    if (isEssayDay(now) && !snoozed("essay") && !day.done.essay) {
      const e = content.essay;
      out.push({ id: "essay", key: "essay", kind: "essay", area: "writing", topic: "essay", title: e.title, note: e.note, minutes: e.minutes, importance: 0.85, ref: "essay" });
    }

    if (day.exposure < 2 && !snoozed("expose")) {
      const week = weekTotals(state, now);
      const idea = content.exposureIdeas[Math.floor(+now / DAY) % content.exposureIdeas.length];
      out.push({ id: "expose", key: "expose", kind: "expose", area: "writing", topic: "exposure",
        title: "Put one thing in front of someone who can say no", note: `Idea for today: ${idea}.`, minutes: 10,
        importance: week.exposure === 0 ? 1 : 0.75, ref: "expose" });
    }

    for (const r of content.routines) {
      const id = "routine:" + r.id;
      if (day.done[id] || snoozed(id)) continue;
      const inSlot = slot && slot.routine === r.id;
      const inOwnWindow = r.window && inWindow(mins, r.window[0], r.window[1]);
      if (!inSlot && !inOwnWindow) continue;
      out.push({ id, key: id, kind: "routine", area: r.area, topic: r.id, title: r.title, note: r.note, minutes: r.minutes,
        importance: 0.9, ref: r.id, noTimer: !!r.noTimer, form: r.form });
    }

    for (const t of state.tasks) {
      const id = "task:" + t.id;
      if (t.done || t.deleted || snoozed(id) || state.hidden[id]) continue;
      out.push({ id, key: id, kind: "task", area: t.area || "maf", topic: t.topic || "task", title: t.title, note: t.note || "",
        minutes: t.minutes || s.blockMin, importance: 0.45 + 0.15 * (t.priority || 1), due: t.due || null, ref: t.id });
    }

    const methods = content.methods
      .filter((m) => !state.hidden["method:" + m.id] && +now - readStat(state, "method:" + m.id, now).last > 3 * DAY)
      .sort((a, b) => readStat(state, "method:" + a.id, now).last - readStat(state, "method:" + b.id, now).last)
      .slice(0, 3);
    for (const m of methods) {
      out.push({ id: "method:" + m.id, key: "method:" + m.id, kind: "method", area: "method", topic: "method", title: m.name,
        note: m.idea, source: m.source, evidence: m.evidence, tryIt: m.try, form: m.form, minutes: 1, importance: 0.25, ref: m.id });
    }
    return out;
  }

  // ---------- 2. features ----------
  function context(state, content, now) {
    const week = weekTotals(state, now), t = state.settings.weeklyTargets, frac = week.days / 7;
    // When each kind of work was last finished, for the repetition penalty.
    const lastDone = {};
    for (let i = state.events.length - 1; i >= 0 && +now - state.events[i].t < REPEAT_WINDOW_MS; i--) {
      const e = state.events[i];
      if (e.type === "complete" && e.kind && !lastDone[e.kind]) lastDone[e.kind] = e.t;
    }
    return {
      lastDone,
      slot: slotAt(content, now),
      writingDay: state.settings.writingDays.includes(new Date(now).getDay()),
      behind: { writing: week.write < t.write * frac, maf: week.study < t.study * frac },
    };
  }

  function features(c, state, now, ctx) {
    // T · time fit and urgency
    let T = 0.45;
    if (ctx.slot) {
      if (c.kind === "routine") T = c.ref === ctx.slot.routine ? 1 : 0.3;
      else T = ctx.slot.fits.includes(c.kind) ? 1 : c.kind === "method" ? 0.4 : 0.15;
    } else if (c.kind === "routine") T = 0.9;          // routines outside a slot are in their own window
    if (c.kind === "write" && ctx.writingDay && !ctx.slot) T = Math.max(T, 0.6);
    if (c.due) T = Math.max(T, clamp01(1 - (new Date(c.due + "T23:59:59") - new Date(now)) / DAY / 14));

    // C · predicted completion: decayed completes vs skips/snoozes, Beta(1,1) prior.
    // Impressions are not evidence either way.
    const st = readStat(state, c.key, now);
    const C = (st.pos + 1) / (st.pos + st.neg + 2);

    // W · importance, nudged up when that side of the week is behind target
    const W = clamp01(c.importance + (ctx.behind[c.area] ? 0.15 : 0));

    // F · staleness: rises the longer since this was last done
    const since = st.touched ? (+now - st.touched) / DAY : 7;
    let F = 1 - Math.exp(-since / 2);
    if (c.kind === "flash") F = Math.max(F, clamp01(0.5 + (c.overdue || 0) / 7));

    // N · novelty: fewer recent showings, more novel
    const N = 1 / (1 + st.shown);

    // explicit negative feedback, fading over a day or two
    let penalty = Math.min(0.5, 0.25 * readStat(state, "snooze:" + c.id, now, SNOOZE_HALF_LIFE_DAYS).neg);
    // repetition: the same kind of work just finished goes to the back for a while
    const repeat = ctx.lastDone && ctx.lastDone[c.kind] && c.kind !== "routine";
    if (repeat) penalty += REPEAT_PENALTY;
    return { T, C, W, F, N, penalty, repeat: !!repeat };
  }

  // ---------- 3. scoring ----------
  function score(f, w) {
    return w.T * f.T + w.C * f.C + w.W * f.W + w.F * f.F + w.N * f.N - f.penalty;
  }

  // ---------- 4. diversity and exploration ----------
  // Most cards of one kind a single feed may hold. Watch cards need internet; setup cards are
  // onboarding, so they come one at a time.
  const KIND_CAP = { watch: 1, setup: 1, default: 3 };
  const capKey = (it) => (it.setup ? "setup" : it.kind);
  const capOf = (k) => (KIND_CAP[k] != null ? KIND_CAP[k] : KIND_CAP.default);

  function diversify(items) {
    const methods = items.filter((i) => i.kind === "method").sort((a, b) => b.score - a.score);
    const pool = items.filter((i) => i.kind !== "method");
    const out = [], used = {};
    while (pool.length) {
      let best = -Infinity, bi = -1;
      for (let i = 0; i < pool.length; i++) {
        const it = pool[i], p1 = out[out.length - 1], p2 = out[out.length - 2];
        if ((used[capKey(it)] || 0) >= capOf(capKey(it))) continue;
        let sc = it.score;
        if (p1 && p1.kind === it.kind) sc -= 0.08;
        if (p1 && p1.topic === it.topic) sc -= 0.05;
        if (p1 && p2 && p1.area === it.area && p2.area === it.area) sc -= 0.03;
        if (sc > best) { best = sc; bi = i; }
      }
      if (bi < 0) break;   // everything left is over its kind's cap
      const it = pool.splice(bi, 1)[0];
      used[capKey(it)] = (used[capKey(it)] || 0) + 1;
      out.push({ ...it, rankScore: best });
    }
    // Exploration budget: up to two method cards, at positions 4 and 9.
    [3, 8].forEach((at, k) => { if (methods[k]) out.splice(Math.min(at, out.length), 0, { ...methods[k], explore: true }); });
    return out;
  }

  function timetableOrder(items, content, now) {
    const mins = minuteOfDay(now), dow = new Date(now).getDay();
    const today = content.slots.filter((s) => s.days.includes(dow)).sort((a, b) => hm(a.from) - hm(b.from));
    const order = (it) => {
      const i = today.findIndex((s) => (it.kind === "routine" ? s.routine === it.ref : s.fits.includes(it.kind)) && hm(s.to) > mins);
      return i < 0 ? 99 : i;
    };
    return items.slice().sort((a, b) => order(a) - order(b) || b.score - a.score);
  }

  // ---------- the feed ----------
  function special(kind, extra) { return { id: "special:" + kind, key: "special:" + kind, kind, area: "life", special: true, ...extra }; }

  function rank(state, content, now, opts = {}) {
    const s = state.settings, dk = dayKey(now), day = peekDay(state, dk);
    if (isQuiet(state, now)) return [special("quiet", { title: "Hard stop", note: `Screens off. Sleep is part of the work. The feed opens at ${s.quietTo}.` })];
    if (day.focus_min >= s.dailyLimitMin) return [special("limit", { title: "That's your limit for today", note: `${Math.round(day.focus_min / 6) / 10} hours of focus. You set the limit at ${s.dailyLimitMin / 60} h. Stop and rest.` })];

    const ctx = context(state, content, now);
    let cands = candidates(state, content, now);
    if (s.area !== "all") cands = cands.filter((c) => c.area === s.area || c.area === "life" || c.kind === "method");
    const scored = cands.map((c) => { const feat = features(c, state, now, ctx); return { ...c, feat, score: score(feat, s.weights) }; });

    let feed = s.mode === "timetable" ? timetableOrder(scored, content, now) : diversify(scored);
    feed = feed.slice(0, opts.limit || 12);
    if ((state.session.blocks || 0) >= s.breakEvery) feed.unshift(special("break", { title: "Break: 5 minutes", note: "Stand up, drink water, look out of a window. Then come back." }));
    feed.push(special("end", { title: "That's the feed", note: "Refresh for a new order, or call it a day." }));
    return feed;
  }

  // ---------- 5. the learning loop ----------
  function record(state, ev, now) {
    // Every event carries a unique id and its device, so two devices' logs can be merged without duplicates.
    const e = { ...ev, t: +now, id: uid(), dev: state.deviceId };
    if (e.type === "impression") {
      const st = state.stats[e.key];
      if (st && +now - (st.last || 0) < 10 * 60000) return false;   // one impression per card per 10 min
      bump(state, e.key, "shown", 1, now);
      state.stats[e.key].last = +now;
    } else if (e.type === "skip") {
      bump(state, e.key, "neg", 0.3, now);                           // weak: swiped past after a real look
    } else if (e.type === "snooze") {
      bump(state, e.key, "neg", 1, now);
      bump(state, "snooze:" + e.item, "neg", 1, now, SNOOZE_HALF_LIFE_DAYS);
      state.snoozed[e.item] = +now + SNOOZE_MS;
    } else if (e.type === "not_interested") {
      bump(state, e.key, "neg", 2, now);
      state.hidden[e.item] = true;
    } else if (e.type === "focus_break") {
      dayRec(state, dayKey(now)).focus_breaks++;
      state.daysAt = +now;
    }
    state.events.push(e);
    if (state.events.length > MAX_EVENTS) state.events.splice(0, state.events.length - MAX_EVENTS);
    return true;
  }

  function complete(state, content, card, res, now) {
    // XP caps apply to the whole day across devices, so measure before and after on the merged day.
    const dk = dayKey(now), day = dayRec(state, dk), before = dayXP(peekDay(state, dk));
    const min = Math.max(0, Math.round(res.minutes || 0));
    state.daysAt = +now;
    if (card.setup) {
      // Entering a page count is housekeeping, not a reading block: no learning signal, no streak.
      record(state, { type: "setup", item: card.id, key: card.key, kind: card.kind }, now);
    } else {
      record(state, { type: "complete", item: card.id, key: card.key, kind: card.kind, minutes: min, rating: res.rating || null }, now);
      bump(state, card.key, "pos", 1, now);
      state.stats[card.key].touched = +now;
      day.active = true;
    }
    // Focus minutes are study and writing time. Class, the walk, tablets and the log don't count.
    const routine = card.kind === "routine" ? content.routines.find((x) => x.id === card.ref) : null;
    const counts = KINDS_WITH_TIMER.includes(card.kind) && !(routine && !routine.study) && !card.setup;
    if (counts) day.focus_min += min;

    switch (card.kind) {
      case "read": {
        const b = state.books.find((x) => x.id === card.ref);
        if (!b) break;
        b.updatedAt = +now;
        if (res.totalPages) b.totalPages = Math.max(1, Math.round(res.totalPages));
        if (res.pageReached != null) {
          const newPage = Math.max(0, Math.min(b.totalPages || Infinity, Math.round(res.pageReached)));
          const read = Math.max(0, newPage - b.page);
          if (!card.setup && min >= 5 && read > 0) {
            const sp = Math.max(0.05, Math.min(5, read / min));
            b.speed = b.speed ? 0.7 * b.speed + 0.3 * sp : sp;
          }
          b.page = newPage;
          day.pages += card.setup ? 0 : read;
          if (b.totalPages && b.page >= b.totalPages) state.badges["finished:" + b.id] = dk;
        }
        day.study_min += card.setup ? 0 : min;
        break;
      }
      case "watch": {
        const m = state.materials.find((x) => x.id === card.ref);
        if (m) { m.minutesDone += min; m.updatedAt = +now; }
        day.study_min += min; break;
      }
      case "flash": day.study_min += min; break;
      case "exam": day.exam_q += Math.max(1, res.count || 1); day.study_min += min; break;
      case "write": day.write_min += min; break;
      case "essay": day.write_min += min; day.done.essay = true; break;
      case "expose": day.exposure += 1; break;
      case "routine": {
        if (routine && routine.sets) Object.assign(day, routine.sets);
        if (routine && routine.study) day.study_min += min;
        day.done[card.id] = true; break;
      }
      case "task": {
        const t = state.tasks.find((x) => x.id === card.ref);
        if (t && res.finished) { t.done = true; t.updatedAt = +now; }
        if (card.area === "writing") day.write_min += min; else if (card.area === "maf") day.study_min += min;
        break;
      }

    }

    if (res.takeaway && res.takeaway.trim()) {
      state.notes.push({ id: uid(), t: +now, item: card.id, title: card.title, kind: card.kind, text: res.takeaway.trim() });
    }
    if (counts && min >= 25 && !(res.distractions > 0)) day.deep_blocks++;
    if (counts && min >= 15) state.session.blocks = (state.session.blocks || 0) + 1;
    awardBadges(state, now);
    const merged = peekDay(state, dk);
    return { xp: dayXP(merged) - before, day: merged };
  }

  /** SM-2 style spacing. grade: 1 again, 3 hard, 4 good, 5 easy. */
  function reviewCard(card, grade, now) {

    if (p.tablets) x += 5;

    return x;
  }
  function questsFor(days) {
    const sum = (f) => days.reduce((s, p) => s + (p[f] || 0), 0);
    return [
      ["Write 150 min", sum("write_min"), 150], ["Study 300 min", sum("study_min"), 300],
      ["10 exam questions", sum("exam_q"), 10], ["1 exposure", sum("exposure"), 1],
      ["Log 6 of 7 days", days.filter((p) => p.log).length, 6],
    ];
  }
  function totals(state, content, now) {
    const weeks = {}, days = allDays(state);
    for (const [k, d] of Object.entries(days)) (weeks[mondayKey(k + "T12:00:00")] = weeks[mondayKey(k + "T12:00:00")] || []).push(d);
    const bonus = Object.values(weeks).reduce((s, w) => s + questsFor(w).filter(([, v, m]) => v >= m).length * 50, 0);
    const xp = Object.values(days).reduce((s, d) => s + dayXP(d), 0) + bonus;
    let li = 0;
    content.levels.forEach((l, i) => { if (xp >= l[0]) li = i; });
    const next = content.levels[li + 1];
    return {
      xp, level: li + 1, name: content.levels[li][1], meaning: content.levels[li][2],
      next: next ? { name: next[1], at: next[0] } : null,
      pct: next ? (xp - content.levels[li][0]) / (next[0] - content.levels[li][0]) : 1,
      quests: questsFor(weeks[mondayKey(now)] || []), streak: streak(state, now),

  }
  function streak(state, now) {
    let n = 0;
    const all = allDays(state);
    const d = new Date(now); d.setHours(12, 0, 0, 0);
    if (!(all[dayKey(d)] || {}).active) d.setDate(d.getDate() - 1);
    while ((all[dayKey(d)] || {}).active) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function awardBadges(state, now) {
    const b = state.badges, dk = dayKey(now), days = Object.values(allDays(state));
    const give = (id, cond) => { if (cond && !b[id]) b[id] = dk; };
    give("first-deep", days.some((d) => d.deep_blocks > 0));
    give("ten-deep", days.reduce((s, d) => s + d.deep_blocks, 0) >= 10);
    give("first-exposure", days.some((d) => d.exposure > 0));
    give("hundred-pages", days.reduce((s, d) => s + d.pages, 0) >= 100);
    give("streak-7", streak(state, now) >= 7);
    give("streak-30", streak(state, now) >= 30);
    give("fifty-cards", state.cards.length >= 50);
  }

  // ---------- evaluation: what the Stats screen shows ----------
  function metrics(state, now, days = 14) {
    const since = +now - days * DAY, ev = state.events.filter((e) => e.t >= since);
    const n = (type) => ev.filter((e) => e.type === type).length;
    const done = ev.filter((e) => e.type === "complete");
    const ratings = done.map((e) => e.rating).filter(Boolean);
    const kinds = new Set(done.map((e) => e.kind)), items = done.map((e) => e.item);
    const repeats = items.filter((x, i) => i > 0 && x === items[i - 1]).length;
    return {
      impressions: n("impression"), starts: n("start"), completes: done.length, skips: n("skip"), snoozes: n("snooze"), hides: n("not_interested"),
      completionRate: n("start") ? done.length / n("start") : null,
      satisfaction: ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : null,
      kindDiversity: kinds.size, repeatRate: items.length > 1 ? repeats / (items.length - 1) : 0,

  }


  // ---------- sync: merging two devices ----------
  //
  // The rules, one per kind of data, chosen so that any two copies merge to the same result
  // no matter which way round or how often they're merged:
  //   days      per device, owned by that device; other devices' copies live in peers and the
  //             newest copy of each device wins. Totals are sums over devices, so nothing is
  //             counted twice and nothing is lost.
  //   events    union by id (the learning log). Stats, snoozes and hidden cards are rebuilt
  //             from the merged log, so learning on one device teaches the other.
  //   books, materials, tasks, flashcards
  //             per item, the most recently changed copy wins (last writer wins). Deleting is
  //             a "deleted" flag, so a delete travels instead of being undone by the other side.
  //   notes     union by id.   badges   union, earliest date.
  //   settings  the most recently changed copy wins, except feed order, side filter and phone
  //             reminders, which stay per device.
  //   resets    "reset learning" and "show hidden cards" are timestamps, so they travel too.
  const LOCAL_ONLY_SETTINGS = ["mode", "area", "remindersOn"];

  /** Deterministic tie-break, so both sides pick the same copy when timestamps are equal. */
  function newer(a, b) {
    const ta = (a && a.updatedAt) || 0, tb = (b && b.updatedAt) || 0;
    if (ta !== tb) return ta > tb ? a : b;
    return JSON.stringify(a) >= JSON.stringify(b) ? a : b;
  }
  function lww(listA, listB) {
    const byId = new Map();
    for (const x of listA || []) if (x && x.id != null) byId.set(x.id, x);
    for (const x of listB || []) if (x && x.id != null) byId.set(x.id, byId.has(x.id) ? newer(byId.get(x.id), x) : x);
    // Keep this device's order, then anything new from the other side.
    const order = [...(listA || []), ...(listB || [])].map((x) => x && x.id).filter((id, i, all) => id != null && all.indexOf(id) === i);
    return order.map((id) => byId.get(id));
  }
  function unionById(listA, listB, keep) {
    const byId = new Map();
    for (const x of [...(listA || []), ...(listB || [])]) if (x && x.id != null && !byId.has(x.id) && (!keep || keep(x))) byId.set(x.id, x);
    return [...byId.values()];
  }

  /** Rebuilds the learned stats, active snoozes and hidden cards from the event log. */
  function rebuildDerived(state) {
    const tmp = { stats: {}, snoozed: {}, hidden: {} };
    const resetAt = state.learningResetAt || 0, clearedAt = state.hiddenClearedAt || 0;
    for (const e of state.events) {
      if (!e || e.t < resetAt) continue;
      if (e.type === "impression") { bump(tmp, e.key, "shown", 1, e.t); tmp.stats[e.key].last = e.t; }
      else if (e.type === "skip") bump(tmp, e.key, "neg", 0.3, e.t);
      else if (e.type === "snooze") {
        bump(tmp, e.key, "neg", 1, e.t);
        bump(tmp, "snooze:" + e.item, "neg", 1, e.t, SNOOZE_HALF_LIFE_DAYS);
        tmp.snoozed[e.item] = Math.max(tmp.snoozed[e.item] || 0, e.t + SNOOZE_MS);
      } else if (e.type === "not_interested") {
        bump(tmp, e.key, "neg", 2, e.t);
        if (e.t > clearedAt) tmp.hidden[e.item] = true;
      } else if (e.type === "complete") { bump(tmp, e.key, "pos", 1, e.t); tmp.stats[e.key].touched = e.t; }
    }
    state.stats = tmp.stats; state.snoozed = tmp.snoozed; state.hidden = tmp.hidden;
    return state;
  }

  /**
   * Merges another device's state (or the PC hub's) into this one and returns a new state.
   * Never mutates either input. Safe to call repeatedly: merging the same data twice changes nothing.
   */
  function merge(local, remote) {
    if (!remote || typeof remote !== "object") return local;
    const out = { ...local };

    // Days: this device keeps its own; every other device's newest copy goes into peers.
    const peers = { ...(local.peers || {}) };
    const offer = (id, entry) => {
      if (!id || !entry || !entry.days) return;
      if (id === local.deviceId) return;                 // never let someone else's copy replace ours
      const cur = peers[id];
      if (!cur || (entry.at || 0) > (cur.at || 0)) peers[id] = entry;
    };
    for (const [id, entry] of Object.entries(remote.peers || {})) offer(id, entry);
    if (!remote.hub) offer(remote.deviceId, { name: remote.deviceName || "Device", days: remote.days || {}, at: remote.daysAt || 0 });
    out.peers = peers;
    // Restoring this device's own backup: its days come back if they're newer than what's here.
    if (remote.deviceId === local.deviceId && !remote.hub && (remote.daysAt || 0) > (local.daysAt || 0)) {
      out.days = remote.days || {}; out.daysAt = remote.daysAt;
    }

    out.learningResetAt = Math.max(local.learningResetAt || 0, remote.learningResetAt || 0);
    out.hiddenClearedAt = Math.max(local.hiddenClearedAt || 0, remote.hiddenClearedAt || 0);

    out.events = unionById(local.events, remote.events, (e) => typeof e.t === "number" && e.t >= out.learningResetAt)
      .sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1));
    if (out.events.length > MAX_EVENTS) out.events = out.events.slice(-MAX_EVENTS);

    out.books = lww(local.books, remote.books);
    out.materials = lww(local.materials, remote.materials);
    out.tasks = lww(local.tasks, remote.tasks);
    out.cards = lww(local.cards, remote.cards);
    out.notes = unionById(local.notes, remote.notes).sort((a, b) => (a.t || 0) - (b.t || 0));

    out.badges = { ...(remote.badges || {}) };
    for (const [k, v] of Object.entries(local.badges || {})) out.badges[k] = out.badges[k] && out.badges[k] < v ? out.badges[k] : v;

    const ls = local.settings || {}, rs = remote.settings || {};
    const win = (rs.updatedAt || 0) > (ls.updatedAt || 0) ? rs : ls;
    out.settings = { ...defaultSettings(), ...win, weights: { ...DEFAULT_WEIGHTS, ...(win.weights || {}) } };
    for (const k of LOCAL_ONLY_SETTINGS) if (k in ls) out.settings[k] = ls[k];

    return rebuildDerived(out);
  }

  /** What a device sends when it syncs: everything except what only makes sense on this device. */
  function syncPayload(state) {
    const { session, synced, quietOverrideUntil, sync, ...rest } = state;
    return rest;
  }

  // ---------- Obsidian: daily-note properties ----------
  const NUM_FIELDS = ["write_min", "study_min", "exam_q", "exposure"];
  const BOOL_FIELDS = ["class", "walk", "tablets", "log"];

    const p = {};

    if (m) { fm = m[1]; body = text.slice(m[0].length); has = true; }
    const lines = fm ? fm.split(/\r?\n/) : [];
    const get = (f) => { const l = lines.find((x) => x.startsWith(f + ":")); return l == null ? null : l.slice(f.length + 1).trim(); };
    const set = (f, v) => { const i = lines.findIndex((x) => x.startsWith(f + ":")); const line = `${f}: ${v}`; if (i >= 0) lines[i] = line; else lines.push(line); };
    for (const f of NUM_FIELDS) {
      const delta = (props[f] || 0) - (synced[f] || 0);
      const cur = parseInt(get(f) || "0", 10) || 0;
      set(f, Math.max(0, cur + delta));
    }
    for (const f of BOOL_FIELDS) set(f, get(f) === "true" || !!props[f]);

    return { text: out, synced: { ...props } };
  }

    DAY, SCHEMA_VERSION, RANK_VERSION, DEFAULT_WEIGHTS, HALF_LIFE_DAYS,
    dayKey, hm, minuteOfDay, inWindow, mondayKey, uid,
    defaultSettings, initialState, migrate, dayRec, readStat, bump, decayFactor,
    slotAt, isQuiet, chunkPages, candidates, context, features, score, diversify, timetableOrder, rank,
    record, complete, reviewCard, newCard, dayXP, questsFor, totals, streak, metrics,
    dailyNoteProps, mergeFrontmatter, weekTotals,

  };

})(typeof window !== "undefined" ? window : globalThis);

<script>/* Soma — the interface. Everything the engine decides is in engine.js; this file only

(function () {

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const now = () => Date.now();
  const slug = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  const ICON = { read: "📖", watch: "🎬", flash: "🗂️", exam: "❓", write: "✍️", essay: "🖋️", expose: "📣", task: "✅", method: "💡",
    quiet: "🌙", limit: "🛑", break: "☕", end: "🏁" };
  const ROUTINE_ICON = { walk: "🌅", tablets: "💊", preread: "👀", class: "🎓", notes: "📝", group: "👥", log: "📓", review: "🔁" };
  const LABEL = { read: "Read", watch: "Watch", flash: "Flashcards", exam: "Exam practice", write: "Write", essay: "Essay", expose: "Exposure",
    routine: "Routine", task: "Task", method: "Method", quiet: "Quiet hours", limit: "Limit", break: "Break", end: "End" };
  const BADGES = { "first-deep": "🧠 First deep block", "ten-deep": "🧠 10 deep blocks", "first-exposure": "📣 First exposure",
    "hundred-pages": "📚 100 pages", "streak-7": "🔥 7-day streak", "streak-30": "🔥 30-day streak", "fifty-cards": "🗂️ 50 flashcards" };

  // ---------- state ----------
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return E.migrate(JSON.parse(raw), C, now()); } catch (e) { /* fall through */ }
    return E.initialState(C, now());
  }
  let state = load();
  state.deviceName = NATIVE ? "Phone" : location.protocol === "file:" ? "PC (file)" : "PC";
  let saveTimer = null;
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 150); }
  function saveNow() {
    clearTimeout(saveTimer);
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast("Couldn't save. Export a backup from Stats."); }
  }
  // A session is a run of blocks without a long gap; after 90 minutes away the break counter resets.
  if (!state.session.lastAt || now() - state.session.lastAt > 90 * 60000) state.session.blocks = 0;

  let feed = [], current = null, view = "feed", focusState = null, audio = null, wakeLock = null;

  // ---------- helpers ----------
  function toast(msg, ms = 2200) {
    const t = $("#toast"); t.innerHTML = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
  }
  function haptic(ms) { try { if (NATIVE) NATIVE.haptic(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* optional */ } }
  function chime() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach((d, i) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = [660, 880, 990][i]; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, audio.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d + 0.22);
        o.start(audio.currentTime + d); o.stop(audio.currentTime + d + 0.25);
      });
    } catch (e) { /* no audio */ }
    haptic(300);
  }
  async function keepAwake(on) {
    if (NATIVE && NATIVE.keepAwake) { try { NATIVE.keepAwake(!!on); } catch (e) { /* optional */ } return; }
    try {
      if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
      else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { wakeLock = null; }
  }
  function download(name, text, type = "application/json") {
    if (NATIVE && NATIVE.saveFile) {
      const path = NATIVE.saveFile(name, text);
      if (path) { toast("Saved to " + esc(path), 4000); return; }
      NATIVE.share(name, text); return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("Copied"); return; } catch (e) { /* fall back */ }
    if (NATIVE) { NATIVE.share("Soma", text); return; }
    sheet(`<h2>Copy this</h2><textarea id="copybox" style="min-height:180px">${esc(text)}</textarea><div class="btns"><button class="btn" data-close>Close</button></div>`);
    $("#copybox").select();
  }
  const today = () => E.dayKey(now());
  // Today across every synced device: what you see. Writes go through the engine to this device's own record.
  const dayNow = () => E.peekDay(state, today());
  function accentFor(area) { return area === "maf" ? "var(--maf)" : area === "writing" ? "var(--writing)" : area === "method" ? "var(--method)" : "var(--life)"; }

  /** What finishing this card would add to today's XP, given what's already earned. */
  function previewXP(c) {
    const d = { ...dayNow() }, before = E.dayXP(d), m = c.minutes || 0;
    if (["read", "watch", "flash", "exam"].includes(c.kind) || (c.kind === "routine" && ["preread", "notes", "group", "review"].includes(c.ref))) d.study_min += m;
    if (c.kind === "exam") d.exam_q += 1;
    if (c.kind === "write" || c.kind === "essay") d.write_min += m;
    if (c.kind === "task") { if (c.area === "writing") d.write_min += m; else if (c.area === "maf") d.study_min += m; }
    if (c.kind === "expose") d.exposure += 1;
    if (c.kind === "routine") { const r = C.routines.find((x) => x.id === c.ref); if (r && r.sets) Object.assign(d, r.sets); }
    return E.dayXP(d) - before;
  }

  // ---------- top bar ----------
  function updateTop() {
    const t = E.totals(state, C, now());
    $("#xp").innerHTML = `<span class="lv">Lv ${t.level} · </span>${t.xp} XP · 🔥${t.streak}`;
    $("#xp").setAttribute("aria-label", `Level ${t.level} ${t.name}, ${t.xp} XP, ${t.streak} day streak. Open stats.`);
    document.querySelectorAll(".modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === state.settings.mode)));
    document.querySelectorAll(".areas button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.area === state.settings.area)));
  }

  // ---------- the feed ----------
  function cardHTML(c, i) {
    const icon = c.kind === "routine" ? ROUTINE_ICON[c.ref] || "🔁" : ICON[c.kind] || "•";
    const xp = c.special ? 0 : previewXP(c);
    const tags = c.special ? "" : `<p class="tags">#${esc(c.area)}${c.topic && c.topic !== c.area ? " #" + esc(slug(c.topic)) : ""}${xp ? ` · <span class="xpburst">+${xp} XP</span>` : ""}</p>`;
    let body = `<span class="kind${c.explore ? " explore" : ""}">${esc(LABEL[c.kind] || c.kind)}</span>
      <h2>${esc(c.title)}</h2>${c.by ? `<p class="by">${esc(c.by)}</p>` : ""}<p class="note">${esc(c.note)}</p>`;
    if (c.kind === "method") body += `<p class="tryit"><b>Try it:</b> ${esc(c.tryIt)}</p><p class="source">${esc(c.source)}<br><span class="evidence">${esc(c.evidence)}</span></p>`;
    if (c.kind === "end") {
      const t = E.totals(state, C, now()), d = dayNow();
      body += `<p class="meta">Today: <b>${E.dayXP(d)} XP</b> · ${d.focus_min} min of focus · ${d.pages} pages · ${d.deep_blocks} deep block${d.deep_blocks === 1 ? "" : "s"}</p>
        <div class="bar" style="margin:8px 0;--accent:var(--gold)"><i style="width:${Math.round(t.pct * 100)}%"></i></div>
        <p class="meta">Level ${t.level} ${esc(t.name)}${t.next ? ` · ${t.next.at - t.xp} XP to ${esc(t.next.name)}` : ""}</p>`;
    }
    if (!c.special) body += `${tags}${c.meta ? "" : ""}<button class="why" data-act="why" data-i="${i}" aria-expanded="false">Why this card?</button><div class="whybox" hidden></div>`;

    let rail = "";
    if (!c.special) {
      const primary = c.kind === "method" ? ["Open", "👁"] : c.noTimer || c.kind === "expose" ? ["Done", "✓"] : c.setup ? ["Set up", "⚙"] : ["Start", "▶"];
      rail = `<div class="rail">
        <button class="primary" data-act="start" data-i="${i}" aria-label="${primary[0]}: ${esc(c.title)}"><span class="ico">${primary[1]}</span>${primary[0]}</button>
        <button data-act="snooze" data-i="${i}" aria-label="Not now"><span class="ico">⏰</span>Not now</button>
        ${["method", "watch", "task"].includes(c.kind) ? `<button data-act="hide" data-i="${i}" aria-label="Not for me"><span class="ico">✕</span>Not for me</button>` : ""}
        ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener" aria-label="Open the course (needs internet)"><span class="ico">🔗</span>Open</a>` : ""}
      </div>`;
    } else if (c.kind === "quiet") rail = `<div class="rail"><button data-act="override" data-i="${i}"><span class="ico">⏳</span>10 more min</button></div>`;
    else if (c.kind === "break") rail = `<div class="rail"><button class="primary" data-act="breakdone" data-i="${i}"><span class="ico">✓</span>Done</button><button data-act="breakskip" data-i="${i}"><span class="ico">↷</span>Skip</button></div>`;
    else if (c.kind === "end") rail = `<div class="rail"><button class="primary" data-act="refresh" data-i="${i}"><span class="ico">↻</span>Refresh</button></div>`;
    else if (c.kind === "limit") rail = `<div class="rail"><button data-act="goto" data-view="settings"><span class="ico">⚙</span>Settings</button></div>`;

    const area = c.special ? "life" : c.area;
    return `<section class="card area-${esc(area)} kind-${esc(c.kind)}" data-i="${i}" aria-roledescription="card" aria-label="${esc(LABEL[c.kind] || "")}: ${esc(c.title)}">
      <div class="big" aria-hidden="true">${icon}</div><div class="card-body">${body}</div>${rail}
      ${i === 0 && feed.length > 1 ? `<div class="swipehint" aria-hidden="true">Swipe up · ↓ key</div>` : ""}</section>`;
  }

  let observer = null;
  function renderFeed(keepId) {
    current = null;
    feed = E.rank(state, C, now());
    const el = $("#view-feed");
    el.innerHTML = feed.map(cardHTML).join("");
    let idx = 0;
    if (keepId) { const k = feed.findIndex((c) => c.id === keepId); if (k >= 0) idx = k; }
    el.scrollTop = idx * el.clientHeight;
    if (observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      for (const en of entries) if (en.isIntersecting && en.intersectionRatio >= 0.6) onActive(+en.target.dataset.i);
    }, { root: el, threshold: [0.6] });
    el.querySelectorAll(".card").forEach((c) => observer.observe(c));
    updateTop();
    save();
  }

  function onActive(i) {
    if (current && current.i === i) return;
    if (current) {
      const prev = feed[current.i], dwell = now() - current.since;
      // A real look (3 s or more) and a swipe past is weak negative feedback. A quick flick is no signal.
      if (prev && !prev.special && !current.started && dwell >= 3000) { E.record(state, { type: "skip", item: prev.id, key: prev.key, kind: prev.kind, dwell }, now()); save(); }
    }
    const c = feed[i];
    if (!c) return;
    current = { i, id: c.id, since: now(), started: false };
    const mark = current;
    setTimeout(() => {
      if (current === mark && !c.special && E.record(state, { type: "impression", item: c.id, key: c.key, kind: c.kind }, now())) save();
    }, 1000);
  }

  function why(i, btn) {
    const c = feed[i], box = btn.nextElementSibling, w = state.settings.weights, f = c.feat;
    if (!box.hidden) { box.hidden = true; btn.setAttribute("aria-expanded", "false"); return; }
    const rows = [["T", "Fits right now", f.T], ["C", "You usually finish these", f.C], ["W", "Importance", f.W], ["F", "Due / not done lately", f.F], ["N", "New to you", f.N]];
    const reasons = [];
    if (f.T >= 0.9) reasons.push("it belongs to this time slot");
    if (f.C >= 0.7) reasons.push("you tend to finish it");
    if (f.F >= 0.8) reasons.push("you haven't done it lately");
    if (f.W >= 0.85) reasons.push("it matters most this week");
    if (c.explore) reasons.push("it's an exploration card, to show you something new");
    if (f.repeat) reasons.push("it's lower because you just did this kind of work");
    if (f.penalty > (f.repeat ? 0.15 : 0)) reasons.push(`it's lower because you said "not now" recently`);
    box.innerHTML = `<p style="margin:0 0 6px">Shown because ${esc(reasons.join(", ") || "it scored highest of what's left")}.</p><table>${rows.map(([k, n, v]) =>
      `<tr><td>${k}</td><td>${n}</td><td style="width:40%"><div class="bar" style="--accent:${accentFor(c.area)}"><i style="width:${Math.round(v * 100)}%"></i></div></td><td>${(w[k] * v).toFixed(2)}</td></tr>`).join("")}
      ${f.penalty ? `<tr><td></td><td>Penalty</td><td></td><td>−${f.penalty.toFixed(2)}</td></tr>` : ""}
      <tr><td></td><td><b>Score</b></td><td></td><td><b>${c.score.toFixed(2)}</b></td></tr></table>
      <p style="margin:6px 0 0">S = ${w.T}·T + ${w.C}·C + ${w.W}·W + ${w.F}·F + ${w.N}·N − penalty. A weighted formula you can change in Settings, not a trained AI.</p>`;
    box.hidden = false; btn.setAttribute("aria-expanded", "true");
  }

  // ---------- starting a card ----------
  function start(c) {
    if (current && current.id === c.id) current.started = true;
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* no audio */ }
    E.record(state, { type: "start", item: c.id, key: c.key, kind: c.kind }, now()); save();
    if (c.kind === "method") return methodSheet(c);
    if (c.kind === "read" && c.setup) return setupSheet(c);
    if (c.kind === "flash") return flashSession(c);
    if (c.form === "log") return logSheet(c);
    if (c.noTimer || c.kind === "expose") return completeSheet(c, { minutes: c.noTimer ? c.minutes : 10 });
    if (c.kind === "routine" && c.ref === "tablets") return finish(c, { minutes: 1 });
    focus(c);
  }

  // ---------- focus timer ----------
  function focus(c) {
    const total = (c.minutes || state.settings.blockMin) * 60000;
    focusState = { c, start: now(), total, pausedAt: null, pausedMs: 0, distractions: 0, leftAt: null };
    const o = $("#focus");
    o.innerHTML = `<p class="small">${esc(LABEL[c.kind] || "")} · ${c.area === "maf" ? "MAF" : c.area === "writing" ? "Writing" : ""}</p>
      <h2>${esc(c.title)}</h2><p class="small">${esc(c.note || "")}</p>
      <div class="ring" style="--accent:${accentFor(c.area)}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--line)" stroke-width="6"/>
      <circle id="arc" cx="50" cy="50" r="45" fill="none" stroke="${accentFor(c.area)}" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0"/></svg>
      <div class="t" id="clock" role="timer" aria-live="off">--:--</div></div>
      <p class="small" id="distract">No focus breaks yet. Leaving the app counts as one.</p>
      <div class="btns" style="justify-content:center"><button class="btn" id="pause">Pause</button><button class="btn primary" id="finish">Finish now</button><button class="btn" id="cancel">Cancel</button></div>`;
    o.hidden = false;
    keepAwake(true);
    if (NATIVE && NATIVE.scheduleTimer) NATIVE.scheduleTimer(String(now() + total), "Time's up: " + c.title);
    $("#pause").onclick = () => {
      if (focusState.pausedAt) { focusState.pausedMs += now() - focusState.pausedAt; focusState.pausedAt = null; $("#pause").textContent = "Pause"; }
      else { focusState.pausedAt = now(); $("#pause").textContent = "Resume"; }
    };
    $("#finish").onclick = () => endFocus(false);
    $("#cancel").onclick = () => { if (confirm("Stop this block without logging it?")) closeFocus(); };
    focusState.timer = setInterval(tick, 250); tick();
  }
  function elapsed() {
    const f = focusState;
    return now() - f.start - f.pausedMs - (f.pausedAt ? now() - f.pausedAt : 0);
  }
  function tick() {
    if (!focusState) return;
    const left = Math.max(0, focusState.total - elapsed());
    const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
    $("#clock").textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    $("#arc").setAttribute("stroke-dashoffset", String(282.7 * (1 - left / focusState.total)));
    document.title = `${$("#clock").textContent} · Soma`;
    if (left <= 0) endFocus(true);
  }
  function closeFocus() {
    if (focusState) clearInterval(focusState.timer);
    focusState = null; $("#focus").hidden = true; document.title = "Soma"; keepAwake(false);
    sync.flush();
    if (NATIVE && NATIVE.cancelTimer) NATIVE.cancelTimer();
  }
  function endFocus(natural) {
    const f = focusState; if (!f) return;
    const minutes = Math.max(1, Math.round(elapsed() / 60000));
    closeFocus();
    if (natural) chime();
    completeSheet(f.c, { minutes, distractions: f.distractions });
  }
  document.addEventListener("visibilitychange", () => {
    if (!focusState || focusState.pausedAt) return;
    // The first 10 seconds are a grace period: a permission prompt or a last look at the
    // phone when you press Start isn't a lapse of focus.
    if (document.hidden && elapsed() < 10000) return;
    if (document.hidden) {
      focusState.distractions++; focusState.leftAt = now();
      E.record(state, { type: "focus_break", item: focusState.c.id, key: focusState.c.key }, now()); saveNow();
    } else if (focusState.leftAt) {
      const away = Math.round((now() - focusState.leftAt) / 60000);
      $("#distract").textContent = `${focusState.distractions} focus break${focusState.distractions > 1 ? "s" : ""}. ${focusState.distractions === 1 ? "The timer kept running." : ""}`;
      toast(away >= 1 ? `Away ${away} min. Counted as a focus break.` : "Focus break counted. Back to it.");
      focusState.leftAt = null; tick();
    }
  });

  // ---------- sheets ----------
  function sheet(html) {
    const w = $("#sheetwrap"); $("#sheet").innerHTML = html; w.hidden = false;
    // Focus the sheet itself, not its first box: on a phone that would pop the keyboard over the form.
    $("#sheet").scrollTop = 0; $("#sheet").focus({ preventScroll: true });
  }
  function closeSheet() { $("#sheetwrap").hidden = true; $("#sheet").innerHTML = ""; if (typeof sync !== "undefined") sync.flush(); }
  function ratingHTML() {
    return `<label>How useful was this block?</label><div class="rating" role="group" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-rate="${n}" aria-pressed="false">${n}</button>`).join("")}</div>`;
  }
  function readRating() { const b = $("#sheet").querySelector('[data-rate][aria-pressed="true"]'); return b ? +b.dataset.rate : null; }

  function completeSheet(c, pre) {
    const f = [];
    f.push(`<h2>${esc(ICON[c.kind] || ROUTINE_ICON[c.ref] || "✓")} ${esc(c.title)}</h2>`);
    if (pre.distractions === 0 && pre.minutes >= 25) f.push(`<p class="small">🧠 A deep block: ${pre.minutes} minutes and no focus breaks.</p>`);
    if (!c.noTimer && c.kind !== "expose") f.push(`<label for="f-min">Minutes</label><input id="f-min" type="number" inputmode="numeric" min="0" max="600" value="${pre.minutes || 0}">`);
    if (c.kind === "read") {
      f.push(`<label for="f-page">Page you reached</label><input id="f-page" type="number" min="0" value="${c.pages ? c.pages.to : ""}">`);
      f.push(`<label for="f-take">Close the book. One thing you remember:</label><textarea id="f-take" placeholder="Retrieval practice: write it from memory"></textarea>`);
      f.push(`<details><summary class="small">Make a flashcard from it</summary><label for="f-q">Question</label><input id="f-q" type="text"><label for="f-a">Answer</label><input id="f-a" type="text"></details>`);
    } else if (c.kind === "exam") {
      f.push(`<label for="f-count">Questions answered</label><input id="f-count" type="number" min="1" max="5" value="1">`);
      f.push(`<label for="f-take">What tripped you up?</label><textarea id="f-take"></textarea>`);
    } else if (c.kind === "write" || c.kind === "essay") {
      f.push(`<label for="f-take">Where did you stop? One line for tomorrow</label><textarea id="f-take" placeholder="Stop mid-scene, while you know what comes next"></textarea>`);
    } else if (c.kind === "expose") {
      f.push(`<label for="f-take">What did you show, and to whom?</label><textarea id="f-take"></textarea>`);
    } else if (c.kind === "task") {
      f.push(`<label><input id="f-done" type="checkbox"> The whole task is finished</label>`);
    } else if (c.kind === "watch" || (c.kind === "routine" && !c.noTimer)) {
      f.push(`<label for="f-take">One takeaway (optional)</label><textarea id="f-take"></textarea>`);
    }
    if (!c.noTimer && c.kind !== "expose") f.push(ratingHTML());
    f.push(`<div class="btns"><button class="btn primary" id="f-save">Log it</button><button class="btn" data-close>Cancel</button></div>`);
    sheet(f.join(""));
    $("#f-save").onclick = () => {
      const v = (id) => { const el = $("#" + id); return el ? el.value : null; };
      const res = { minutes: c.noTimer || c.kind === "expose" ? c.minutes : +(v("f-min") || 0), distractions: pre.distractions || 0, rating: readRating(), takeaway: v("f-take") || "" };
      if (c.kind === "read" && v("f-page") !== "") res.pageReached = +v("f-page");
      if (c.kind === "exam") res.count = +(v("f-count") || 1);
      if (c.kind === "task") res.finished = $("#f-done").checked;
      if (c.kind === "read" && v("f-q") && v("f-a")) { state.cards.push(E.newCard(c.topic || "General", v("f-q"), v("f-a"), now())); }
      closeSheet(); finish(c, res);
    };
  }

  function setupSheet(c) {
    sheet(`<h2>📖 ${esc(c.title)}</h2><p class="small">${esc(c.by || "")}</p>
      <label for="s-total">How many pages?</label><input id="s-total" type="number" min="1" placeholder="e.g. 640">
      <label for="s-page">Page you're on now</label><input id="s-page" type="number" min="0" value="0">
      <div class="btns"><button class="btn primary" id="s-save">Save</button><button class="btn" data-close>Later</button></div>`);
    $("#s-save").onclick = () => {
      const total = +$("#s-total").value, page = +$("#s-page").value || 0;
      if (!total) { toast("Enter the page count"); return; }
      closeSheet(); finish(c, { minutes: 0, totalPages: total, pageReached: page }, true);
    };
  }

  function methodSheet(c) {
    const form = c.form === "intention"
